version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: test_institucion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "cd institucion &&
             python manage.py migrate &&
             python manage.py test"
    environment:
      - DEBUG=False
      - SECRET_KEY=test-secret-key-not-for-production
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=test_institucion
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend/institucion-app
      dockerfile: Dockerfile
    command: npm run build
    ports:
      - "3000:3000"
