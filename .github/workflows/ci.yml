name: CI/CD Pipeline - Django

on:
  push:
    branches: [master, main, ci-setup]
  pull_request:
    branches: [master, main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # SESIÓN 1 – Tests automatizados
  # ──────────────────────────────────────────────────────────────────────────────
  test:
    name: "Sesión 1 – Tests Django"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: institucion_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-insecure-key-only-for-testing-do-not-use-in-prod
      DEBUG: "True"
      POSTGRES_DB: institucion_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/institucion/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/institucion/requirements.txt

      - name: Verificar estructura del proyecto
        run: |
          echo "=== Estructura del proyecto ==="
          ls backend/institucion/
          echo "=== manage.py ==="
          test -f backend/institucion/manage.py && echo "manage.py encontrado ✓"
          echo "=== requirements.txt ==="
          test -f backend/institucion/requirements.txt && echo "requirements.txt encontrado ✓"
          echo "=== App academico ==="
          test -d backend/institucion/apps/academico && echo "app academico encontrada ✓"

      - name: Ejecutar migraciones de prueba
        working-directory: backend/institucion
        run: python manage.py migrate --run-syncdb

      - name: Ejecutar suite de tests
        working-directory: backend/institucion
        run: python manage.py test apps.academico.tests --verbosity=2

  # ──────────────────────────────────────────────────────────────────────────────
  # SESIÓN 2 & 3 – Build de imagen Docker
  # ──────────────────────────────────────────────────────────────────────────────
  build:
    name: "Sesión 2/3 – Build Docker"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen Docker
        working-directory: backend/institucion
        run: |
          docker build -t institucion-backend:${{ github.sha }} .
          docker build -t institucion-backend:latest .

      - name: Verificar imagen generada
        run: |
          echo "=== Imágenes Docker disponibles ==="
          docker images | grep institucion-backend
          echo ""
          echo "=== Información de la imagen ==="
          docker inspect institucion-backend:latest | python3 -c "
          import json, sys
          data = json.load(sys.stdin)[0]
          print(f'ID: {data[\"Id\"][:20]}...')
          print(f'Creada: {data[\"Created\"]}')
          print(f'Arquitectura: {data[\"Architecture\"]}')
          print(f'Tamaño: {round(data[\"Size\"]/1024/1024, 1)} MB')
          "

      - name: Guardar artefacto de imagen (simulado)
        run: |
          docker save institucion-backend:latest | gzip > /tmp/institucion-backend.tar.gz
          echo "Imagen guardada: $(du -h /tmp/institucion-backend.tar.gz | cut -f1)"

      - name: Exportar imagen como artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp/institucion-backend.tar.gz
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # SESIÓN 3 – Simulación de despliegue continuo
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-simulation:
    name: "Sesión 3 – Simulación Deploy"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Descargar artefacto de imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp/artifacts

      - name: Cargar imagen desde artefacto
        run: |
          docker load < /tmp/artifacts/institucion-backend.tar.gz
          echo "Imagen cargada correctamente ✓"
          docker images | grep institucion-backend

      - name: Simular despliegue con Docker Compose
        working-directory: backend/institucion
        run: |
          echo "=== Iniciando despliegue simulado ==="
          docker compose up -d
          echo "Esperando que los contenedores arranquen..."
          sleep 15

      - name: Validar contenedores en ejecución
        run: |
          echo "=== Estado de los contenedores ==="
          docker compose -f backend/institucion/docker-compose.yml ps
          echo ""
          echo "=== Logs del contenedor web (últimas 20 líneas) ==="
          docker compose -f backend/institucion/docker-compose.yml logs web --tail=20

      - name: Validar respuesta HTTP del servidor
        run: |
          echo "=== Verificando que el servidor responde ==="
          for i in {1..10}; do
            if curl -sf http://localhost:8000/api/academico/modalidades; then
              echo ""
              echo "Servidor respondió correctamente ✓"
              break
            fi
            echo "Intento $i fallido, reintentando en 3s..."
            sleep 3
          done

      - name: Apagar contenedores
        if: always()
        working-directory: backend/institucion
        run: docker compose down -v
