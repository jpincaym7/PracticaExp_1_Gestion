name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_institucion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend/institucion
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov

    - name: Create .env file
      run: |
        cd backend/institucion
        echo "DEBUG=False" > .env
        echo "SECRET_KEY=test-secret-key-not-for-production" >> .env
        echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env
        echo "DB_ENGINE=django.db.backends.postgresql" >> .env
        echo "DB_NAME=test_institucion" >> .env
        echo "DB_USER=postgres" >> .env
        echo "DB_PASSWORD=postgres" >> .env
        echo "DB_HOST=localhost" >> .env
        echo "DB_PORT=5432" >> .env

    - name: Run Django migrations
      run: |
        cd backend/institucion
        python manage.py migrate --noinput

    - name: Run backend tests with coverage
      run: |
        cd backend/institucion
        pytest --cov=apps --cov-report=xml --cov-report=html --cov-report=term-summary tests/

    - name: Upload backend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/institucion/coverage.xml
        flags: backend
        name: backend-coverage

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/institucion-app/package-lock.json'

    - name: Install frontend dependencies
      run: |
        cd frontend/institucion-app
        npm ci

    - name: Run ESLint
      run: |
        cd frontend/institucion-app
        npm run lint 2>&1 || true

    - name: Build frontend
      run: |
        cd frontend/institucion-app
        npm run build

    - name: Run frontend tests (if available)
      run: |
        cd frontend/institucion-app
        npm test -- --passWithNoTests 2>&1 || true

  build-verification:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Verify backend build
      run: |
        cd backend/institucion
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python manage.py collectstatic --noinput --dry-run

    - name: Verify frontend build
      run: |
        cd frontend/institucion-app
        npm ci
        npm run build

    - name: Generate build report
      run: |
        echo "=== BUILD VERIFICATION REPORT ===" > build-report.txt
        echo "Date: $(date)" >> build-report.txt
        echo "Backend Status: ✅ OK" >> build-report.txt
        echo "Frontend Status: ✅ OK" >> build-report.txt
        echo "All systems verified successfully" >> build-report.txt
        cat build-report.txt

    - name: Upload build report
      uses: actions/upload-artifact@v3
      with:
        name: build-report
        path: build-report.txt
